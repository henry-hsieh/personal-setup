name: opencode
version: 1.18.18
datasource: github-releases
package: anomalyco/opencode
url: https://github.com/anomalyco/opencode/releases/download/v{version}/opencode-linux-x64.tar.gz
extract: true
checksum_source: github-release
files:
  - src: opencode
    dst: .local/bin/opencode
  - src: https://opencode.ai/config.json
    dst: .config/opencode/schema.json
  - src: "{pkg_dir}/opencode.jsonc"
    dst: .config/opencode/opencode.jsonc
  - src: "{pkg_dir}/tui.jsonc"
    dst: .config/opencode/tui.jsonc
test:
  type: version-check
init_cmds:
  - opencode completion > $HOME/.local/share/bash-completion/completions/opencode.bash
  - |
    # Install @opencode-ai/plugin in OpenCode config directory
    OPENCODE_CONFIG_DIR=$HOME/.config/opencode/
    rm -rf $OPENCODE_CONFIG_DIR/node_modules/
    rm -rf $OPENCODE_CONFIG_DIR/package.json
    rm -rf $OPENCODE_CONFIG_DIR/package-lock.json
    rm -rf $OPENCODE_CONFIG_DIR/bun.lock
    cd ${OPENCODE_CONFIG_DIR}
    bun add --exact @opencode-ai/plugin@{version}
    npm install --package-lock-only
    # Install OpenCode plugins
    OPENCODE_PLUGIN_DIR=$HOME/.cache/opencode/packages/
    rm -rf $HOME/.cache/opencode/
    mkdir -p $OPENCODE_PLUGIN_DIR
    for plugin in $(cpp -P $HOME/.config/opencode/opencode.jsonc | yq -r '.plugin[] | select(type == "!!str")'); do
      PLUGIN_PATH=${OPENCODE_PLUGIN_DIR}/${plugin}
      mkdir -p ${PLUGIN_PATH}
      cd ${PLUGIN_PATH}
      bun add --exact ${plugin}
      npm install --package-lock-only
      # Pre-download Magic Context's local embedding model into the release
      # archive so the airgap environment serves it from cache on first use.
      if [[ "${plugin}" == @cortexkit/opencode-magic-context@* ]]; then
        MODEL_CACHE_DIR=$HOME/.local/share/cortexkit/magic-context/models
        MODEL_DIR="${MODEL_CACHE_DIR}/Xenova/all-MiniLM-L6-v2"
        # Verify every artifact a partial download could leave missing, so a
        # broken cache is healed instead of silently shipped to the airgap.
        if [[ ! -f "${MODEL_DIR}/config.json" || ! -f "${MODEL_DIR}/tokenizer.json" \
          || ! -f "${MODEL_DIR}/tokenizer_config.json" || ! -f "${MODEL_DIR}/onnx/model.onnx" ]]; then
          PRECACHE_SCRIPT='import { env, pipeline } from "@huggingface/transformers";
          env.cacheDir = process.env.MODEL_CACHE_DIR;
          const pipe = await pipeline("feature-extraction", "Xenova/all-MiniLM-L6-v2", { dtype: "fp32" });
          pipe.dispose?.();
          console.log("[opencode] magic-context embedding model pre-downloaded");'
          MODEL_CACHE_DIR="${MODEL_CACHE_DIR}" bun -e "$PRECACHE_SCRIPT"
        fi
      fi
      # Pre-download AFT's embedding model + ONNX Runtime into the release
      # archive so the airgap environment serves them from cache on first use.
      if [[ "${plugin}" == @cortexkit/aft-opencode@* ]]; then
        # \b keeps this from matching INVALID_ORT_VERSION in the same file
        ORT_VERSION=$(grep -oP '\bORT_VERSION\s*=\s*"\K[^"]+' \
          "${PLUGIN_PATH}/node_modules/@cortexkit/aft-bridge/dist/onnx-runtime.js" 2>/dev/null)
        if [[ -n "${ORT_VERSION}" ]]; then
          AFT_MODEL_REF="$HOME/.local/share/cortexkit/aft/semantic/models/models--Qdrant--all-MiniLM-L6-v2-onnx/refs/main"
          AFT_MARKER="$HOME/.local/share/cortexkit/aft/onnxruntime/${ORT_VERSION}/.aft-onnx-installed"
          if [[ ! -f "$AFT_MODEL_REF" || ! -f "$AFT_MARKER" ]]; then
            python3 {pkg_dir}/precache-aft.py "${ORT_VERSION}"
            echo "[opencode] AFT embedding model + ONNX Runtime ${ORT_VERSION} pre-downloaded"
          fi
        else
          echo "[opencode] WARNING: could not determine AFT ONNX Runtime version; airgap pre-download skipped"
        fi
      fi
      # Compile Ensemble's browser-loaded Tailwind CSS at release build time.
      # The dashboard then serves a single self-contained document in airgap.
      if [[ "${plugin}" == @hueyexe/opencode-ensemble@* ]]; then
        ENSEMBLE_PATH="${PLUGIN_PATH}/node_modules/${plugin%@*}"
        TAILWIND_CDN_VERSION=$(python3 -c '
    import re
    from urllib.request import Request, urlopen

    request = Request("https://cdn.tailwindcss.com", headers={"User-Agent": "curl/8.0"})
    with urlopen(request, timeout=30) as response:
      source = response.read().decode("utf-8")

    name_match = re.search(r"tailwindcss v\$\{([A-Za-z_$][A-Za-z0-9_$]*)\}", source)
    if name_match is None:
      raise SystemExit("could not find the Tailwind version variable")

    version_pattern = (
      r"(?<![A-Za-z0-9_$])"
      + re.escape(name_match.group(1))
      + r"\s*=\s*\"(\d+(?:\.\d+){2}(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)\""
    )
    version_match = re.search(version_pattern, source)
    if version_match is None:
      raise SystemExit("could not find the Tailwind version")

    print(version_match.group(1))
    ')
        if [[ -z "${TAILWIND_CDN_VERSION}" ]]; then
          echo "[opencode] ERROR: could not determine the Tailwind version served by cdn.tailwindcss.com"
          exit 1
        fi
        if [[ ! "${TAILWIND_CDN_VERSION}" =~ ^3\. ]]; then
          echo "[opencode] ERROR: Ensemble dashboard Tailwind build requires v3 (got ${TAILWIND_CDN_VERSION})"
          exit 1
        fi
        python3 {pkg_dir}/patch-ensemble-dashboard.py prepare "${ENSEMBLE_PATH}"
        (
          cd "${ENSEMBLE_PATH}"
          bun x --bun "tailwindcss@${TAILWIND_CDN_VERSION}" \
            --config .personal-setup-tailwind.config.cjs \
            --input src/.personal-setup-dashboard.css \
            --output src/dashboard-tailwind.css \
            --minify
        )
        python3 {pkg_dir}/patch-ensemble-dashboard.py apply "${ENSEMBLE_PATH}"
        rm -f "${ENSEMBLE_PATH}/.personal-setup-tailwind.config.cjs" \
          "${ENSEMBLE_PATH}/src/.personal-setup-dashboard.css"
        echo "[opencode] Ensemble dashboard Tailwind CSS embedded for airgap use"
      fi
      if [[ "${plugin}" == @bybrawe/opencode-goal@* ]]; then
        rm -rf /tmp/opencode-goal
        env OPENCODE_CONFIG_DIR=/tmp/opencode-goal npx -y ${plugin}
        cp -r /tmp/opencode-goal/commands/ $OPENCODE_CONFIG_DIR/
      fi
      if [[ "${plugin}" == @bybrawe/opencode-loop@* ]]; then
        rm -rf /tmp/opencode-loop
        env OPENCODE_CONFIG_DIR=/tmp/opencode-loop npx -y ${plugin}
        # Remove experimental loop goal commands because we have goal plugin
        rm -rf /tmp/opencode-loop/commands/loop-goal*
        cp -rf /tmp/opencode-loop/commands/ $OPENCODE_CONFIG_DIR/
        # Patch local agent to hidden subagent
        sed -i 's/mode: primary/mode: subagent\nhidden: true/' /tmp/opencode-loop/agents/opencode-loop-local.md
        cp -rf /tmp/opencode-loop/agents/ $OPENCODE_CONFIG_DIR/
      fi
    done
