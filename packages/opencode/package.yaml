name: opencode
version: 2.2.4
datasource: github-releases
package: anomalyco/opencode
url: https://github.com/anomalyco/opencode/releases/download/v{version}/opencode-linux-x64.tar.gz
extract: true
checksum_source: github-release
files:
  - src: opencode
    dst: .local/bin/opencode
  - src: https://opencode.ai/config.json
    dst: .config/opencode/schema.json
  - src: "{pkg_dir}/opencode.jsonc"
    dst: .config/opencode/opencode.jsonc
test:
  type: cmd
  cmd: "opencode --version && test -d \"$HOME/.config/opencode/skills/opencode-ensemble\" && test -d \"$HOME/.config/opencode/skills/uv-package-manager\" && bun test \"$ROOT_DIR/tests/opencode/wait.test.ts\" \"$ROOT_DIR/tests/opencode/wait-plugin.test.ts\" \"$ROOT_DIR/tests/opencode/wait-tui.test.ts\" \"$ROOT_DIR/tests/opencode/kata.test.ts\" \"$ROOT_DIR/tests/opencode/pca.test.ts\" \"$ROOT_DIR/tests/opencode/legacy-cleanup.test.ts\" \"$ROOT_DIR/tests/opencode/precache-magic-context.test.ts\""
init_cmds:
  - |
    bash {pkg_dir}/scripts/init.sh {version}
