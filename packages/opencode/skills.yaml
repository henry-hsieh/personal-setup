# Pre-installed OpenCode agent skills.
#
# This is the single source of truth for which agent skills ship in the
# environment and at what version. Renovate bumps each entry's `version`
# automatically (see renovate.json5 "OpenCode Skills" managers), so a single
# PR can update every skill at once.
#
# Field order matters: each entry must list `datasource` FIRST and `name` LAST
# (with `branch` right after `datasource` for git-refs). The Renovate custom
# managers anchor on the unique `datasource:` line and read the remaining
# fields afterward, so this layout is what lets the regex match unambiguously.
#
# ref = git tag (datasource: github-tags) or commit SHA (datasource: git-refs).
# src = path to the skill directory inside the repo (must contain SKILL.md).
# dst = destination under $HOME (opencode discovers skills in
#       ~/.config/opencode/skills/<name>/).
skills:
  - datasource: git-refs
    branch: main
    version: e984b5f1c90ccfc62d09ed12b30adb71854e2b75
    package: hueyexe/opencode-ensemble
    src: skills/opencode-ensemble
    dst: .config/opencode/skills/opencode-ensemble
    name: opencode-ensemble
  - datasource: git-refs
    branch: main
    version: 7e2fb559cf4b824b27f1fec49fe88f7511066d26
    package: wshobson/agents
    src: plugins/python-development/skills/uv-package-manager
    dst: .config/opencode/skills/uv-package-manager
    name: uv-package-manager
