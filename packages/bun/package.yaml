name: bun
version: 1.3.14
datasource: github-releases
package: oven-sh/bun
url: https://github.com/oven-sh/bun/releases/download/bun-v{version}/bun-linux-x64.zip
extract: true
version_prefix: bun-v
checksum_source: github-release
files:
  - src: bun
    dst: .local/bin/bun
    chmod: "755"
  - src: https://raw.githubusercontent.com/oven-sh/bun/refs/tags/bun-v{version}/completions/bun.bash
    dst: .local/share/bash-completion/completions/bun.bash
    sha256: 15e26e705cc82212e9fc50359b82d87b92154fb0015005f3be0f538f873ac3f1
  - src: https://raw.githubusercontent.com/oven-sh/bun/refs/tags/bun-v{version}/completions/bun.fish
    dst: .config/fish/completions/bun.fish
    sha256: 08dc1a496b9d5f82e71d65f50a14470e5c5da870719956ffcefa2d2491fa6962
init_cmds:
  - bash {pkg_dir}/install-bun-packages.sh
subpackages:
  manifest: src/settings/.local/share/personal-setup/package.json
  manifest_type: npm
  test_defaults:
    type: version-check
  packages:
    - name: "@fission-ai/openspec"
      bin: openspec
    - name: "@github/copilot-language-server"
      bin: copilot-language-server
    - name: vscode-langservers-extracted
      bin: vscode-json-language-server
      test:
        type: lsp-stdio
    - name: vim-language-server
      test:
        type: lsp-stdio
