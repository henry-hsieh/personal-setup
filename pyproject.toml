[project]
name = "personal-setup"
version = "2.0.0"
description = "Facilitate the easy setup and maintenance of a personalized Linux environment"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "tenacity>=9.1.2",
]

[tool.uv]
package = false

[tool.ruff.lint]
# Default pycodestyle/pyflakes plus all Bandit security rules.
select = ["E4", "E7", "E9", "F", "S"]

[tool.ruff.lint.per-file-ignores]
# build.py deliberately spawns toolchain subprocesses (git, bun, ...) and
# extracts package archives from pinned release URLs into controlled temp dirs.
"src/build.py" = ["S202", "S603", "S607"]
# install-skills.py downloads repo-pinned GitHub zipballs and extracts them.
"packages/opencode/scripts/install-skills.py" = ["S301", "S310"]
